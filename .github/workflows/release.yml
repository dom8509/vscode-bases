name: Release

on:
  push:
    tags:
      - "*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Take the version from the tag (v1.2.3 -> 1.2.3) so the .vsix matches it.
      - name: Set version from tag
        run: npm version "${GITHUB_REF_NAME#v}" --no-git-tag-version --allow-same-version

      - name: Typecheck, test, build
        run: npm run check

      - name: Package .vsix
        run: npx vsce package --out "vscode-bases-${GITHUB_REF_NAME}.vsix"

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" "vscode-bases-${GITHUB_REF_NAME}.vsix" --title "$GITHUB_REF_NAME" --generate-notes
