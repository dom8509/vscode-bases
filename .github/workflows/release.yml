# Builds the extension as a .vsix and publishes it as a GitHub release
# whenever a version tag (v1.2.3) is pushed for a commit on main.
name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check that the tag is on main
        run: |
          git fetch origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::Tag $GITHUB_REF_NAME does not point to a commit on main."
            exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Take the version from the tag (v1.2.3 -> 1.2.3) so the .vsix matches it.
      - name: Set version from tag
        run: npm version "${GITHUB_REF_NAME#v}" --no-git-tag-version --allow-same-version

      - name: Typecheck, test, build
        run: npm run check

      - name: Package .vsix
        run: npx vsce package --out "vscode-bases-${GITHUB_REF_NAME}.vsix"

      # A release made by hand on GitHub (which also makes the tag) gets the .vsix added.
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "vscode-bases-${GITHUB_REF_NAME}.vsix" --clobber
          else
            gh release create "$GITHUB_REF_NAME" "vscode-bases-${GITHUB_REF_NAME}.vsix" \
              --title "$GITHUB_REF_NAME" \
              --generate-notes
          fi
